name: Build Android APK

on:
  push:
    branches: ["arena/01a08b3f-game02"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Native Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble installable debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Validate APK is present
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Neon Sector Run APK
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Sector-Run-v1.0.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
